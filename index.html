/* ==========================================================================
   Design system — maroon / cream / yellow, inspired by a BI-SaaS landing page
   ========================================================================== */
:root {
  --maroon: #3a0f1e;
  --maroon-2: #55182c;
  --maroon-3: #6b2339;
  --cream: #f6f3ec;
  --cream-2: #ece7dc;
  --white: #ffffff;
  --yellow: #f4ee6b;
  --ink: #2a0c16;
  --muted: #6d5b61;
  --muted-on-dark: #d9c3ca;
  --line: rgba(58, 15, 30, .14);
  --line-dark: rgba(255, 255, 255, .16);
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 10px 30px rgba(58, 15, 30, .08);
  --head: "Archivo", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 64px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 8px); }
body { margin: 0; font-family: var(--body); color: var(--ink); background: var(--cream); line-height: 1.6; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3, h4 { font-family: var(--head); line-height: 1.08; margin: 0; letter-spacing: -.01em; }
p { margin: 0 0 1rem; }
ul { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; box-shadow: 0 0 0 5px var(--maroon); border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--yellow); color: var(--maroon); padding: .6rem 1rem; border-radius: 8px; z-index: 100; }
.skip:focus { left: 8px; }
.wrap { width: min(1160px, 100% - 40px); margin-inline: auto; }

.dots { background-color: var(--cream); background-image: radial-gradient(rgba(58,15,30,.09) 1px, transparent 1px); background-size: 22px 22px; }

/* ---------- Nav ---------- */
.nav { position: sticky; top: 0; z-index: 50; background: rgba(246,243,236,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav-inner { height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.brand { font-family: var(--head); font-weight: 800; font-size: 1.25rem; text-decoration: none; color: var(--maroon); }
.nav-menu { display: flex; align-items: center; gap: 1.4rem; }
.nav-menu a:not(.btn) { text-decoration: none; font-size: .92rem; font-weight: 500; color: var(--ink); padding: .25rem 0; border-bottom: 2px solid transparent; }
.nav-menu a:not(.btn):hover, .nav-menu a.active { border-color: var(--maroon); }
.nav-toggle { display: none; background: none; border: 1px solid var(--line); border-radius: 10px; width: 44px; height: 44px; cursor: pointer; padding: 0; position: relative; }
.nav-toggle span { position: absolute; left: 11px; right: 11px; height: 2px; background: var(--maroon); transition: transform .2s, opacity .2s; }
.nav-toggle span:nth-child(1) { top: 15px; } .nav-toggle span:nth-child(2) { top: 21px; } .nav-toggle span:nth-child(3) { top: 27px; }
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: .5rem; font: 600 .95rem var(--body); text-decoration: none; padding: .85rem 1.35rem; border-radius: 999px; border: 1.5px solid transparent; cursor: pointer; transition: transform .15s, background .15s, box-shadow .15s; }
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn[hidden] { display: none; }
.btn-dark { background: var(--maroon); color: var(--cream); }
.btn-dark:hover { background: var(--maroon-2); }
.btn-yellow { background: var(--yellow); color: var(--maroon); }
.btn-ghost { background: transparent; color: var(--maroon); border-color: var(--maroon); }
.btn-ghost-light { background: transparent; color: var(--cream); border-color: rgba(255,255,255,.45); }
.btn-sm { padding: .55rem 1.05rem; font-size: .85rem; }
.btn .arr { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--yellow); color: var(--maroon); font-size: .8rem; }

/* ---------- Sections ---------- */
.section { padding: clamp(64px, 9vw, 112px) 0; }
.section.dark { background: var(--maroon); color: var(--cream); }
.pill { display: inline-block; font-size: .78rem; font-weight: 600; padding: .3rem .8rem; border: 1px solid var(--line); border-radius: 999px; background: var(--white); color: var(--maroon); margin-bottom: 1rem; }
.dark .pill { background: transparent; color: var(--cream); border-color: var(--line-dark); }
.h2 { font-size: clamp(2rem, 4.6vw, 3.4rem); text-transform: uppercase; font-weight: 800; color: var(--maroon); max-width: 18ch; }
.dark .h2 { color: var(--cream); }
.lead { color: var(--muted); max-width: 62ch; margin-top: 1rem; }
.dark .lead { color: var(--muted-on-dark); }

/* ---------- Hero ---------- */
.hero { padding: clamp(48px, 7vw, 88px) 0 clamp(56px, 8vw, 96px); }
.hero-top { text-align: center; max-width: 900px; margin: 0 auto; }
.hero h1 { font-size: clamp(2.3rem, 6.2vw, 4.6rem); text-transform: uppercase; font-weight: 800; color: var(--maroon); }
.hero .intro { color: var(--muted); font-size: 1.05rem; max-width: 70ch; margin: 1.4rem auto 1.2rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-bottom: 1.6rem; }
.chip { font-size: .8rem; font-weight: 600; padding: .3rem .8rem; border-radius: 999px; background: var(--white); border: 1px solid var(--line); color: var(--maroon); }
.dark .chip { background: rgba(255,255,255,.08); border-color: var(--line-dark); color: var(--cream); }
.cta { display: flex; flex-wrap: wrap; gap: .8rem; justify-content: center; }
.tagline { margin-top: 1.4rem; font-size: .85rem; letter-spacing: .06em; color: var(--muted); }

.hero-panel { margin-top: clamp(36px, 5vw, 64px); background: var(--cream-2); border: 1px solid var(--line); border-radius: 28px; padding: clamp(14px, 2.4vw, 28px); display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
.photo-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
.photo-slot { aspect-ratio: 4 / 4.4; background: linear-gradient(160deg, var(--maroon-2), var(--maroon)); display: grid; place-items: center; color: var(--yellow); position: relative; }
.photo-slot img { width: 100%; height: 100%; object-fit: cover; }
.photo-slot .initials { font: 800 4rem var(--head); }
.photo-slot small { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; color: var(--muted-on-dark); font-size: .7rem; padding: 0 .6rem; }
.photo-meta { padding: .9rem 1rem 1.1rem; }
.photo-meta strong { display: block; font-family: var(--head); color: var(--maroon); }
.photo-meta span { font-size: .85rem; color: var(--muted); }

.mock { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.2rem 1.2rem; position: relative; }
.mock-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
.mock-title { display: flex; align-items: center; gap: .6rem; font-weight: 600; font-size: .9rem; }
.logo-sq { width: 28px; height: 28px; border-radius: 8px; background: var(--yellow); color: var(--maroon); display: grid; place-items: center; font: 800 .8rem var(--head); }
.mock-tag { font-size: .72rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: .15rem .6rem; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1rem; }
.kpi { background: var(--cream); border-radius: var(--radius-sm); padding: .7rem .8rem; border: 1px solid var(--line); }
.kpi b { display: block; font: 800 1.15rem var(--head); color: var(--maroon); }
.kpi span { font-size: .72rem; color: var(--muted); line-height: 1.25; display: block; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding: 0 .2rem; border-bottom: 1px solid var(--line); }
.bars i { flex: 1; background: var(--maroon); border-radius: 6px 6px 0 0; }
.bars i:nth-child(3n) { background: var(--maroon-3); }
.bars i.hi { background: var(--yellow); outline: 1px solid var(--maroon); }
.mock-note { font-size: .72rem; color: var(--muted); margin: .6rem 0 0; }

/* ---------- About ---------- */
.about-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: clamp(28px, 5vw, 64px); margin-top: 2.2rem; align-items: start; }
.about-text p { color: var(--ink); font-size: 1.02rem; }
.bring { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.6rem; box-shadow: var(--shadow); }
.bring h3 { font-size: 1.15rem; color: var(--maroon); text-transform: uppercase; margin-bottom: 1rem; }
.bring li { display: flex; gap: .7rem; padding: .55rem 0; border-top: 1px solid var(--line); font-size: .95rem; }
.bring li:first-child { border-top: 0; }
.bring li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: .5rem; border-radius: 3px; background: var(--yellow); outline: 1.5px solid var(--maroon); }

/* ---------- Experience ---------- */
.exp-list { display: grid; gap: 22px; margin-top: 2.4rem; }
.exp-card { background: rgba(255,255,255,.05); border: 1px solid var(--line-dark); border-radius: 24px; padding: clamp(22px, 3vw, 36px); }
.exp-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .6rem 2rem; margin-bottom: 1.4rem; }
.exp-head h3 { font-size: clamp(1.4rem, 2.6vw, 2rem); text-transform: uppercase; }
.exp-head .role { color: var(--yellow); font-weight: 600; margin-top: .3rem; }
.exp-meta { text-align: right; color: var(--muted-on-dark); font-size: .92rem; }
.exp-meta strong { color: var(--cream); display: block; }
.proj { border-top: 1px solid var(--line-dark); padding-top: 1.3rem; margin-top: 1.3rem; }
.proj h4 { font-size: 1.1rem; margin-bottom: .4rem; }
.proj .note { display: inline-block; font-size: .78rem; background: rgba(244,238,107,.12); color: var(--yellow); border-radius: 8px; padding: .25rem .6rem; margin-bottom: .9rem; }
.proj li { position: relative; padding-left: 1.3rem; margin: .45rem 0; color: #f0e3e7; font-size: .95rem; }
.proj li::before { content: ""; position: absolute; left: 0; top: .6rem; width: 7px; height: 7px; border-radius: 2px; background: var(--yellow); }
.relevance { margin-top: 1rem; font-size: .92rem; color: var(--muted-on-dark); border-left: 3px solid var(--yellow); padding-left: .9rem; }

/* ---------- Project card ---------- */
.feature { margin-top: 2.4rem; background: var(--white); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: 1.05fr 1fr; }
.shot-area { background: var(--maroon); padding: clamp(16px, 2.4vw, 30px); }
.shot-sticky { position: sticky; top: calc(var(--nav-h) + 20px); display: flex; flex-direction: column; gap: 12px; }
.shot { border-radius: 14px; overflow: hidden; border: 1px solid var(--line-dark); background: var(--maroon-2); aspect-ratio: var(--ar, 16 / 9); position: relative; }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--pos, center); }
.shot .zoom { position: absolute; inset: 0; padding: 0; margin: 0; border: 0; background: none; cursor: zoom-in; display: block; border-radius: inherit; }
.shot .zoom img { display: block; }
.shot.missing .zoom, .shot.missing > img { display: none; }
.shot-ph { display: none; position: absolute; inset: 0; place-items: center; text-align: center; padding: 1rem; color: var(--muted-on-dark); font-size: .85rem; border: 2px dashed rgba(255,255,255,.28); border-radius: 14px; }
.shot.missing .shot-ph { display: grid; }
.shot-ph b { display: block; color: var(--yellow); margin-bottom: .3rem; }
.shot-ph code { font-size: .72rem; word-break: break-all; opacity: .85; }
.thumbs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.thumbs .shot-ph { font-size: .68rem; padding: .4rem; }
.thumbs .shot-ph code, .thumbs .shot-ph b { display: none; }
.feat-body { padding: clamp(22px, 3.2vw, 40px); }
.status { display: inline-flex; align-items: center; gap: .45rem; font-size: .76rem; font-weight: 600; padding: .25rem .7rem; border-radius: 999px; background: var(--yellow); color: var(--maroon); }
.feat-body h3 { font-size: clamp(1.6rem, 3vw, 2.3rem); text-transform: uppercase; color: var(--maroon); margin: .9rem 0 .6rem; }
.feat-body p { color: var(--muted); font-size: .96rem; }
.feat-body h4 { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--maroon); margin: 1.2rem 0 .5rem; }
.qlist li { position: relative; padding-left: 1.1rem; font-size: .9rem; margin: .3rem 0; color: var(--ink); }
.qlist li::before { content: "→"; position: absolute; left: 0; color: var(--maroon-3); }
.fact-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 1rem 0 0; }
.fact { background: var(--cream); border: 1px solid var(--line); border-radius: 12px; padding: .55rem .8rem; font-size: .8rem; }
.fact b { display: block; font-family: var(--head); font-size: 1rem; color: var(--maroon); }
.pending-box { border: 1.5px dashed var(--maroon-3); border-radius: 12px; padding: .8rem 1rem; font-size: .88rem; color: var(--muted); background: rgba(244,238,107,.18); }
.link-row { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.4rem; }
.fine { font-size: .78rem; color: var(--muted); margin-top: 1rem; }
.more-note { margin-top: 1.4rem; font-size: .88rem; color: var(--muted); }

/* ---------- Skills ---------- */
.skill-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 2.4rem; }
.skill-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem; transition: transform .2s, box-shadow .2s; }
.skill-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.skill-card h3 { font-size: 1.1rem; text-transform: uppercase; color: var(--maroon); margin-bottom: 1rem; }
.skill-card .chips { justify-content: flex-start; margin: 0 0 1rem; }
.skill-card .chip { background: var(--cream); }
.skill-card p { font-size: .88rem; color: var(--muted); margin: 0; }

/* ---------- Education ---------- */
.edu-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-top: 2.4rem; }
.edu-stack { display: grid; gap: 20px; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.6rem; }
.card h3 { font-size: 1.2rem; color: var(--maroon); margin-bottom: .5rem; }
.card .sub { color: var(--muted); font-size: .92rem; margin-bottom: .3rem; }
.card .when { font-size: .85rem; font-weight: 600; color: var(--maroon-3); }
.badge-done { display: inline-block; margin-left: .5rem; font-size: .72rem; background: var(--yellow); color: var(--maroon); padding: .1rem .55rem; border-radius: 999px; }
.cert { background: var(--maroon); color: var(--cream); border-color: var(--maroon); }
.cert h3 { color: var(--cream); }
.cert .sub { color: var(--muted-on-dark); }
.cert .when { color: var(--yellow); }
.cert .tag { display: inline-block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--yellow); margin-bottom: .8rem; }

/* ---------- Contact ---------- */
.contact-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: clamp(24px, 5vw, 64px); align-items: start; }
.contact-list { display: grid; gap: 12px; }
.contact-item { display: flex; flex-direction: column; background: rgba(255,255,255,.06); border: 1px solid var(--line-dark); border-radius: 16px; padding: 1rem 1.2rem; text-decoration: none; transition: background .15s, transform .15s; }
a.contact-item:hover { background: rgba(255,255,255,.12); transform: translateY(-2px); }
.contact-item small { color: var(--muted-on-dark); font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; }
.contact-item span { font-weight: 600; word-break: break-word; }

/* ---------- Footer ---------- */
.footer { background: #2a0b16; color: var(--muted-on-dark); font-size: .85rem; }
.footer .wrap { display: flex; justify-content: space-between; gap: 1rem; padding: 1.4rem 0; flex-wrap: wrap; }
.footer a { color: var(--yellow); }

/* ---------- Case study page ---------- */
.case { padding: clamp(36px, 5vw, 64px) 0 clamp(64px, 8vw, 100px); min-height: 70vh; }
.crumb { font-size: .88rem; margin-bottom: 1.4rem; }
.crumb a { color: var(--maroon-3); }
.case h1 { font-size: clamp(2rem, 5vw, 3.6rem); text-transform: uppercase; color: var(--maroon); max-width: 22ch; margin: .9rem 0 1rem; }
.case-grid { display: grid; grid-template-columns: 240px 1fr; gap: clamp(24px, 4vw, 56px); margin-top: 2.4rem; align-items: start; }
.case-grid > * { min-width: 0; }
.toc { position: sticky; top: calc(var(--nav-h) + 20px); max-height: calc(100vh - var(--nav-h) - 40px); overflow-y: auto; font-size: .86rem; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.2rem; }
.toc b { display: block; font-family: var(--head); text-transform: uppercase; color: var(--maroon); margin-bottom: .6rem; }
.toc a { display: block; padding: .28rem 0; text-decoration: none; color: var(--muted); }
.toc a:hover, .toc a.active { color: var(--maroon); }
.toc a.active { font-weight: 600; }
.toc-sub { margin: 0 0 .3rem .7rem; padding-left: .7rem; border-left: 2px solid var(--line); font-size: .8rem; }
.cs-section { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(20px, 3vw, 32px); margin-bottom: 18px; }
.cs-section h2 { font-size: 1.35rem; color: var(--maroon); margin-bottom: 1rem; display: flex; gap: .7rem; align-items: baseline; }
.cs-section h2 .num { font-size: .8rem; background: var(--yellow); color: var(--maroon); border-radius: 8px; padding: .15rem .5rem; }
.cs-section p { color: var(--ink); }
.codeblock { margin: 1rem 0; border-radius: 14px; overflow: hidden; background: #1e0a12; border: 1px solid var(--maroon); }
.codeblock .cap { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem 1rem; background: var(--maroon); color: var(--muted-on-dark); font-size: .75rem; }
.codeblock .cap b { color: var(--yellow); text-transform: uppercase; }
.codeblock pre { margin: 0; padding: 1rem; overflow-x: auto; color: #f6e9ec; font: .82rem/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.page-cards { display: grid; gap: 12px; }
.page-card { border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.2rem; background: var(--cream); }
.page-card b { color: var(--maroon); font-family: var(--head); }
.shots-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 1rem; }
.shots-grid figure { margin: 0; }
.shots-grid figcaption { font-size: .8rem; color: var(--muted); margin-top: .4rem; }
.shots-grid .shot { background: var(--maroon-2); }
.notfound { text-align: center; padding: 5rem 0; }

/* ---------- Case study: components ---------- */
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; background: rgba(58,15,30,.07); padding: .08em .35em; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.subtitle { font-weight: 600; color: var(--maroon-3) !important; margin: -.2rem 0 .8rem !important; }
.subtitle-lg { font: 600 clamp(1rem, 2vw, 1.3rem) var(--head); color: var(--maroon-3); margin: -.2rem 0 1rem; }
.sub-h { font-size: 1.05rem; color: var(--maroon); margin: 1.6rem 0 .8rem; }
.cs-section .qlist li { font-size: .96rem; margin: .5rem 0; padding-left: 1.2rem; }
.callout { background: rgba(244,238,107,.24); border-left: 4px solid var(--maroon); border-radius: 10px; padding: .85rem 1rem; font-size: .9rem; margin: 1rem 0; }

.fig { margin: 0; }
.fig figcaption { font-size: .8rem; color: var(--muted); margin-top: .45rem; }
.fig .shot { background: var(--cream-2); border: 1px solid var(--line); }
.dash-fig { margin: 1.2rem 0 .4rem; }
.dash-fig .shot { box-shadow: var(--shadow); }
.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.dash-card { border: 1px solid var(--line); background: var(--cream); border-radius: 14px; padding: .9rem 1rem; }
.dash-card b { font-family: var(--head); color: var(--maroon); }

    logic: "`TRY_CONVERT` returns NULL instead of an error when a value cannot be converted, so non-blank values that convert to NULL can be counted and listed. Amounts, balances, fees and risk scores are tested as `DECIMAL(18,2)`. Credit scores are tested as `INT` and again as `DECIMAL(10,2)`, which separates values that fail only the integer test from values that are not numeric at all. Dates are tested under styles 23 (yyyy-mm-dd), 103 (dd/mm/yyyy), 101 (mm/dd/yyyy), 105 (dd-mm-yyyy) and 106 (dd mon yyyy) and combined with `COALESCE`, which uses the first style that succeeds, so the order of styles matters.",

/* Shared helpers used by both pages. */
(function () {
  const S = window.SITE;

  const esc = (t) =>
    String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  window.PF = {
    S,
    esc,
    /* Escape, then turn `code` into <code>code</code>. */
    rich(t) {
      return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>");
    },
    ext(url, label, cls) {
      return url ? `<a class="btn ${cls}" href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>` : "";
    },
    /* Screenshot. Keeps the image's own aspect ratio (via --ar) unless opts.ar overrides it.
       If the file is missing, a labelled placeholder appears instead of a broken image. */
    shot(s, opts = {}) {
      const ar = opts.ar || (s.w && s.h ? `${s.w} / ${s.h}` : "16 / 9");
      const pos = opts.pos || "center";
      const ph = `<div class="shot-ph"><div><b>${esc(s.label)}</b>Screenshot not found<br><code>${esc(s.src || "")}</code></div></div>`;
      const dims = s.w && s.h ? `width="${s.w}" height="${s.h}"` : "";
      const img = s.src
        ? `<img src="${s.src}" alt="${esc(s.alt || s.label)}" ${dims} loading="${opts.eager ? "eager" : "lazy"}" decoding="async" onerror="this.closest('.shot').classList.add('missing')">`
        : "";
      const media = opts.zoom && s.src
        ? `<button class="zoom" type="button" data-zoom aria-label="View ${esc(s.label)} full size">${img}</button>`
        : img;
      return `<div class="shot" style="--ar:${ar};--pos:${pos}">${ph}${media}</div>`;
    },
    resumeLinks() {
      document.querySelectorAll("[data-resume]").forEach((a) => {
        if (S.resumeUrl) { a.href = S.resumeUrl; a.hidden = false; }
        else a.hidden = true;
      });
    },
    year() {
      const y = document.getElementById("year");
      if (y) y.textContent = new Date().getFullYear();
    },
    /* Click any [data-zoom] button to open its image full size in a dialog. */
    lightbox() {
      const dlg = document.createElement("dialog");
      dlg.className = "lb";
      dlg.setAttribute("aria-label", "Image preview");
      dlg.innerHTML = '<button class="lb-close" type="button" aria-label="Close preview">×</button><div class="lb-scroll"><img alt=""></div>';
      document.body.appendChild(dlg);
      const img = dlg.querySelector("img");
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-zoom]");
        if (!b) return;
        const src = b.querySelector("img");
        if (!src) return;
        img.src = src.currentSrc || src.src;
        img.alt = src.alt;
        if (dlg.showModal) dlg.showModal(); else window.open(img.src, "_blank", "noopener");
      });
      dlg.addEventListener("click", (e) => {
        if (e.target === dlg || e.target.closest(".lb-close") || e.target.classList.contains("lb-scroll")) dlg.close();
      });
    }
  };
})();

/* Tiny dependency-free syntax highlighter (SQL and DAX) plus a clipboard helper. */
(function () {
  const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const set = (s) => new Set(s.split(" "));

  const SQL_KW = set("SELECT FROM WHERE GROUP BY HAVING ORDER ASC DESC AS WITH INTO UNION ALL CASE WHEN THEN ELSE END AND OR NOT IN IS NULL OVER PARTITION CROSS APPLY VALUES DISTINCT TOP ON");
  const SQL_TY = set("DECIMAL INT BIGINT DATE DATETIME2 BIT VARCHAR");
  const DAX_KW = set("VAR RETURN IN");
  const DAX_CONST = set("TRUE FALSE BLANK");

  /* Groups: 1 comment, 2 single-quoted, 3 double-quoted, 4 [bracketed], 5 number, 6 word, 7 anything else */
  const SQL_RE = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^']|'')*')|("(?:[^"]|"")*")|(\[[^\]\n]*\])|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  const DAX_RE = /(\/\/[^\n]*|--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^']|'')*')|("(?:[^"]|"")*")|(\[[^\]\n]*\])|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;

  const span = (c, t) => `<span class="tk-${c}">${esc(t)}</span>`;

  function highlight(text, lang) {
    const dax = lang === "dax";
    const re = new RegExp((dax ? DAX_RE : SQL_RE).source, "g");
    let out = "", m;
    while ((m = re.exec(text))) {
      if (m[1]) out += span("c", m[1]);
      else if (m[2]) out += span(dax ? "t" : "s", m[2]);       // DAX 'Table' vs SQL 'string'
      else if (m[3]) out += span("s", m[3]);
      else if (m[4]) out += span("col", m[4]);
      else if (m[5]) out += span("n", m[5]);
      else if (m[6]) {
        const w = m[6], up = w.toUpperCase();
        const nextChar = text[re.lastIndex];
        if (dax) {
          if (DAX_KW.has(up)) out += span("k", w);
          else if (nextChar === "(") out += span("f", w);
          else if (DAX_CONST.has(up)) out += span("k", w);
          else out += esc(w);
        } else {
          if (SQL_KW.has(up)) out += span("k", w);
          else if (SQL_TY.has(up)) out += span("t", w);
          else if (nextChar === "(") out += span("f", w);
          else out += esc(w);
        }
      } else out += esc(m[7]);
    }
    return out;
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* fall through to the legacy path */ }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  window.Code = { highlight, copyText };
})();

        <div class="photo-meta"><strong>${esc(S.name)}</strong><span>${esc(S.title)}</span></div>
      </div>
      ${p0 ? `
      <div class="mock" role="img" aria-label="Illustrative dashboard layout with facts about the Banking Transaction Analytics project">
        <div class="mock-head">
          <div class="mock-title"><span class="logo-sq">BT</span>${esc(p0.title)}</div>
          <span class="mock-tag">Illustrative layout</span>
        </div>
        <div class="kpis">${p0.heroKpis.map((k) => `<div class="kpi"><b>${esc(k.v)}</b><span>${esc(k.k)}</span></div>`).join("")}</div>
        <div class="bars" aria-hidden="true">${bars}</div>
        <p class="mock-note">Chart shapes are decorative, not results. Figures above come from the project's SQL checks.</p>
      </div>` : ""}
    </div>
  </div>`;

  /* ---------- About ---------- */
  $("about").innerHTML = `
  <div class="wrap">
    <span class="pill">About</span>
    <h2 class="h2">From enterprise IT to business analytics</h2>
    <div class="about-grid">
      <div class="about-text">${S.about.paragraphs.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
      <aside class="bring"><h3>What I Bring</h3><ul>${S.about.bring.map((b) => `<li>${esc(b)}</li>`).join("")}</ul></aside>
    </div>
  </div>`;

  /* ---------- Experience ---------- */
  const expCard = (e) => `
    <article class="exp-card">
      <div class="exp-head">
        <div><h3>${esc(e.company)}</h3><div class="role">${esc(e.role)}</div></div>
        <div class="exp-meta"><strong>${esc(e.dates)}</strong>${esc(e.location)}<br>${esc(e.domain)}</div>
      </div>
      ${e.projects.map((p) => `
        <div class="proj">
          <h4>${esc(p.name)}</h4>
          ${p.note ? `<span class="note">${esc(p.note)}</span>` : ""}
          <ul>${p.bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>
          ${p.relevance ? `<p class="relevance">${esc(p.relevance)}</p>` : ""}
        </div>`).join("")}
    </article>`;
  $("experience").innerHTML = `
  <div class="wrap">
    <span class="pill">Experience</span>
    <h2 class="h2">Hands-on with banking and ERP data</h2>
    <p class="lead">Professional experience in banking and payments, plus an ERP-focused internship.</p>
    <div class="exp-list">${S.experience.map(expCard).join("")}</div>
  </div>`;

  /* ---------- Projects ---------- */
  const projCard = (p) => {
    const l = p.links || {};
    const hasFindings = p.findings && p.findings.length;
    return `
    <article class="feature">
      <div class="shot-area">
        <div class="shot-sticky">
          ${shot(p.screenshots[0], { eager: true })}
          ${p.screenshots.length > 1 ? `<div class="thumbs">${p.screenshots.slice(1, 3).map((s) => shot(s, { ar: "16 / 10", pos: "left top" })).join("")}</div>` : ""}
        </div>
      </div>
      <div class="feat-body">
        <span class="status">● ${esc(p.status)}</span>
        <h3>${esc(p.title)}</h3>
        <p class="subtitle">${esc(p.subtitle || "")}</p>
        <p>${esc(p.summary)}</p>
        <h4>Business problem</h4>
        <p>${esc(p.businessProblem)}</p>
        <div class="chips" style="justify-content:flex-start;margin:.4rem 0 0">${p.tools.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
        <div class="fact-row">${p.facts.map((f) => `<div class="fact"><b>${esc(f.v)}</b>${esc(f.k)}</div>`).join("")}</div>
        <h4>Key analytical questions</h4>
        <ul class="qlist">${p.questions.slice(0, 4).map((q) => `<li>${esc(q)}</li>`).join("")}</ul>
        <h4>Main findings</h4>
        ${hasFindings
          ? `<ul class="qlist">${p.findings.slice(0, 3).map((f) => `<li>${esc(f)}</li>`).join("")}</ul>`
          : `<div class="pending-box">Findings will be published here once validated against the dataset. See the case study for the investigation approach.</div>`}
        ${p.recommendations && p.recommendations.length ? `<h4>Recommendations</h4><ul class="qlist">${p.recommendations.map((r) => `<li>${esc(r.split(/(?<=\.)\s/)[0])}</li>`).join("")}</ul>` : ""}
        <div class="link-row">
          <a class="btn btn-dark" href="#case">View Case Study <span class="arr">→</span></a>
          ${ext(l.github, "GitHub Repository", "btn-ghost")}
          ${ext(l.powerbi, "Power BI Report", "btn-ghost")}
          ${ext(l.docs, "Documentation", "btn-ghost")}
        </div>
        <p class="fine">${esc(p.disclaimer)}</p>
      </div>
    </article>`;
  };
  $("projects").innerHTML = `
  <div class="wrap">
    <span class="pill">Projects</span>
    <h2 class="h2">Featured analytics project</h2>
    <p class="lead">An independent portfolio project, separate from my professional work.</p>
    <div id="featured-project">${S.projects.map(projCard).join("")}</div>
  </div>`;

  /* ---------- Skills ---------- */
  $("skills").innerHTML = `
  <div class="wrap">
    <span class="pill">Skills</span>
    <h2 class="h2">Tools, and where I've used them</h2>
    <div class="skill-grid">${S.skills.map((g) => `
      <article class="skill-card">
        <h3>${esc(g.group)}</h3>
        <div class="chips">${g.items.map((i) => `<span class="chip">${esc(i)}</span>`).join("")}</div>
        <p>${esc(g.applied)}</p>
      </article>`).join("")}
    </div>
  </div>`;

  /* ---------- Education + certification ---------- */
  const c = S.certification;
  $("education").innerHTML = `
  <div class="wrap">
    <span class="pill">Education</span>
    <h2 class="h2">Education & certification</h2>
    <div class="edu-grid">
      <div class="edu-stack">${S.education.map((e) => `
        <article class="card">
          <h3>${esc(e.degree)}</h3>
          <div class="sub">${esc(e.school)}</div>
          <div class="when">${esc(e.dates)}${e.status ? `<span class="badge-done">${esc(e.status)}</span>` : ""}</div>
          ${e.areas.length ? `<div class="chips" style="justify-content:flex-start;margin:1rem 0 0">${e.areas.map((a) => `<span class="chip" style="background:var(--cream)">${esc(a)}</span>`).join("")}</div>` : ""}
        </article>`).join("")}
      </div>
      <article class="card cert">
        <span class="tag">Certification</span>
        <h3>${esc(c.title)}</h3>
        <div class="sub">${esc(c.provider)} · via ${esc(c.platform)}</div>
        <div class="when">Completed ${esc(c.date)}</div>
        ${c.imageUrl ? `<img src="${c.imageUrl}" alt="${esc(c.title)} certificate" style="margin-top:1rem;border-radius:12px" loading="lazy">` : ""}
        ${c.verifyUrl ? `<div class="link-row"><a class="btn btn-yellow btn-sm" href="${c.verifyUrl}" target="_blank" rel="noopener noreferrer">Verify certificate</a></div>` : ""}
      </article>
    </div>
  </div>`;

  /* ---------- Contact ---------- */
  const tel = (S.phoneHref || S.phone).replace(/[^+\d]/g, "");
  const item = (label, text, href, external) => href
    ? `<a class="contact-item" href="${href}" ${external ? 'target="_blank" rel="noopener noreferrer"' : ""}><small>${label}</small><span>${esc(text)}</span></a>`
    : `<div class="contact-item"><small>${label}</small><span>${esc(text)}</span></div>`;
  $("contact").innerHTML = `
  <div class="wrap contact-grid">
    <div>
      <span class="pill">Contact</span>
      <h2 class="h2">${esc(S.contact.heading)}</h2>
      <p class="lead">${esc(S.contact.text)}</p>
      <div class="cta" style="justify-content:flex-start;margin-top:1.6rem">
        <a class="btn btn-yellow" href="mailto:${S.email}">Email Me <span class="arr" style="background:var(--maroon);color:var(--yellow)">→</span></a>
      </div>
    </div>
    <div class="contact-list">
      ${item("Email", S.email, "mailto:" + S.email)}
      ${item("Phone", S.phone, "tel:" + tel)}
      ${item("Location", S.location, "")}
      ${S.linkedin ? item("LinkedIn", "View profile", S.linkedin, true) : ""}
      ${S.github ? item("GitHub", "View profile", S.github, true) : ""}
    </div>
  </div>`;

  /* ---------- Behaviour ---------- */
  window.PF.resumeLinks();
  window.PF.year();

  const toggle = $("navToggle"), menu = $("navMenu");
  const setMenu = (open) => {
    menu.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", open);
    toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  };
  toggle.addEventListener("click", () => setMenu(!menu.classList.contains("open")));
  menu.addEventListener("click", (e) => { if (e.target.closest("a")) setMenu(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

  /* Highlight the current section in the nav */
  const links = [...menu.querySelectorAll('a[href^="#"]')];
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) links.forEach((a) => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id));
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    ["home", "about", "experience", "projects", "skills", "education", "contact"].forEach((id) => io.observe($(id)));
  }
})();

  </script>
  <script>
/* Renders a case study from data/content.js (+ data/<project>-sql.js).
   URL: project.html?p=<slug> */
(function () {
  const { S, esc, rich, ext, shot } = window.PF;
  const { highlight, copyText } = window.Code;
  const main = document.getElementById("caseMain");
  const slug = new URLSearchParams(location.search).get("p") || (S.projects[0] && S.projects[0].slug);
  const p = S.projects.find((x) => x.slug === slug);

  window.PF.resumeLinks();
  window.PF.year();
  window.PF.lightbox();

  if (!p) {
    main.innerHTML = `<div class="wrap notfound"><h1 class="h2" style="margin:0 auto 1rem">Project not found</h1><p>That case study doesn't exist.</p><a class="btn btn-dark" href="#projects">Back to projects</a></div>`;
    document.title = "Project not found | Chandra Mohan R";
    return;
  }

  document.title = `${p.title} | Case Study | Chandra Mohan R`;
  const groups = (window.SQL_GROUPS && window.SQL_GROUPS[p.slug]) || [];
  const shots = Object.fromEntries(p.screenshots.map((s) => [s.id, s]));
  const copyStore = [];   // raw code strings, indexed by data-copy

  /* ---------- small pieces ---------- */
  const figure = (s, caption) =>
    s ? `<figure class="fig">${shot(s, { zoom: true })}${caption || s.label ? `<figcaption>${esc(caption || s.label)}</figcaption>` : ""}</figure>` : "";

  const table = (head, rows, caption) => `
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>${head.map((h) => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map((r) => `<tr>${r.map((c, i) => (i === 0 ? `<th scope="row">${esc(c)}</th>` : `<td>${esc(c)}</td>`)).join("")}</tr>`).join("")}</tbody>
      ${caption ? `<caption>${esc(caption)}</caption>` : ""}
    </table></div>`;

  /* Expandable code block with a Copy button. */
  let qn = 0;
  function codeBlock({ id, title, code, lang, open, note, copyLabel }) {
    const bodyId = `qb-${++qn}`;
    const idx = copyStore.push(code) - 1;
    return `
    <div class="qb" data-qb>
      <div class="qb-head">
        <button class="qb-toggle" type="button" aria-expanded="${open ? "true" : "false"}" aria-controls="${bodyId}">
          ${id ? `<span class="qb-id">${esc(id)}</span>` : ""}<span class="qb-title">${esc(title)}</span><span class="chev" aria-hidden="true"></span>
        </button>
        <button class="copy" type="button" data-copy="${idx}" data-label="${esc(copyLabel)}" aria-label="${esc(copyLabel)}: ${esc(title)}">${esc(copyLabel)}</button>
      </div>
      <div class="qb-body" id="${bodyId}" ${open ? "" : "hidden"}>
        ${note ? `<p class="qb-note">${rich(note)}</p>` : ""}
        <pre tabindex="0" aria-label="${lang.toUpperCase()} code"><code>${highlight(code, lang)}</code></pre>
      </div>
    </div>`;
  }

  function sqlGroup(g) {
    const queries = g.queries.map((q, i) => {
      const block = codeBlock({ id: `${g.id}${i + 1}`, title: q.title, code: q.sql, lang: "sql", open: !!q.open, note: q.note, copyLabel: "Copy SQL" });
      return q.figure ? `<div class="split">${block}${figure(shots[q.figure])}</div>` : block;
    }).join("");
    return `
    <section class="sql-group" id="sql-${g.id}" aria-labelledby="sql-${g.id}-h">
      <h3 id="sql-${g.id}-h"><span class="gtag">${esc(g.id)}</span>${esc(g.title)}</h3>
      <dl class="gmeta">
        <div><dt>Purpose</dt><dd>${rich(g.purpose)}</dd></div>
        <div><dt>Key logic</dt><dd>${rich(g.logic)}</dd></div>
        <div><dt>Business relevance</dt><dd>${rich(g.relevance)}</dd></div>
      </dl>
      ${g.table ? table(g.table.head, g.table.rows, g.table.caption) : ""}
      <div class="queries">${queries}</div>
    </section>`;
  }

  /* ---------- block renderers ---------- */
  const R = {
    p: (b) => `<p>${rich(b.text)}</p>`,
    list: (b) => `<ul class="qlist">${b.items.map((i) => `<li>${rich(i)}</li>`).join("")}</ul>`,
    note: (b) => `<div class="callout">${rich(b.text)}</div>`,
    table: (b) => table(b.head, b.rows, b.caption),
    findings: () => `<ul class="qlist">${p.findings.map((f) => `<li>${rich(f)}</li>`).join("")}</ul>`,
    recommendations: () => `<ul class="qlist">${p.recommendations.map((r) => `<li>${rich(r)}</li>`).join("")}</ul>`,
    pipeline: (b) => `
      <ol class="pipe" aria-label="Data pipeline">
        ${b.stages.map((s) => `
          <li class="pipe-step">
            <span class="pipe-name">${esc(s.name)}</span>
            <code>${esc(s.table)}</code>
            ${s.rows ? `<b>${esc(s.rows)}</b>` : ""}
            <span class="pipe-desc">${esc(s.desc)}</span>
          </li>`).join("")}
      </ol>`,
    sqlgroups: () => groups.length
      ? `<div class="sql-tools">
           <button class="btn btn-ghost btn-sm" type="button" data-expand="all">Expand all queries</button>
           <button class="btn btn-ghost btn-sm" type="button" data-expand="none">Collapse all</button>
           <span class="sr-only" aria-live="polite" id="copy-status"></span>
         </div>${groups.map(sqlGroup).join("")}`
      : `<div class="callout">SQL for this project has not been added yet.</div>`,
    dashboard: () => {
      const d = p.dashboard;
      return `
        <p>${rich(d.intro)}</p>
        <div class="dash-fig">${figure(shots[d.shot], "Power BI report: full dashboard")}</div>
        <h3 class="sub-h">What each part shows</h3>
        <div class="dash-grid">${d.elements.map((e) => `<div class="dash-card"><b>${esc(e.name)}</b><p>${rich(e.text)}</p></div>`).join("")}</div>`;
    },
    dax: () => `
      <div class="callout">${rich(p.daxNote)}</div>
      <div class="dax-list">${p.dax.map((m) => `
        <article class="dax-card">
          <header><h3>${esc(m.name)}</h3><span class="badge ${m.status === "verified" ? "ok" : ""}">${m.status === "verified" ? "Verified" : "Illustrative"}${m.optional ? " · optional" : ""}</span></header>
          ${codeBlock({ title: "DAX formula", code: m.code, lang: "dax", open: true, copyLabel: "Copy DAX" })}
          <p class="dax-text">${rich(m.text)}</p>
        </article>`).join("")}
      </div>`
  };

  const renderBlock = (b) => (R[b.t] ? R[b.t](b) : "");
  const section = (s, i) => `
    <section class="cs-section" id="${s.id}" aria-labelledby="${s.id}-h">
      <h2 id="${s.id}-h"><span class="num">${String(i + 1).padStart(2, "0")}</span>${esc(s.title)}</h2>
      ${s.blocks.map(renderBlock).join("")}
    </section>`;

  const toc = p.caseStudy.map((s, i) => {
    const sub = s.id === "sql" ? `<div class="toc-sub">${groups.map((g) => `<a href="#sql-${g.id}">${g.id}. ${esc(g.title)}</a>`).join("")}</div>` : "";
    return `<a href="#${s.id}">${i + 1}. ${esc(s.title)}</a>${sub}`;
  }).join("");

  main.innerHTML = `
  <div class="wrap">
    <p class="crumb"><a href="#projects">Projects</a> / Case study</p>
    <span class="status">● ${esc(p.status)}</span>
    <h1>${esc(p.title)}</h1>
    ${p.subtitle ? `<p class="subtitle-lg">${esc(p.subtitle)}</p>` : ""}
    <p class="lead">${esc(p.summary)}</p>
    <div class="chips" style="justify-content:flex-start;margin-top:1.2rem">${p.tools.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
    <div class="fact-row">${p.facts.map((f) => `<div class="fact"><b>${esc(f.v)}</b>${esc(f.k)}</div>`).join("")}</div>
    <div class="link-row">
      <a class="btn btn-dark" href="#dashboard">See the dashboard <span class="arr">↓</span></a>
      <a class="btn btn-ghost" href="#sql">SQL workflow</a>
      <a class="btn btn-ghost" href="#dax">DAX measures</a>
      ${ext(p.links.github, "GitHub Repository", "btn-ghost")}
      ${ext(p.links.powerbi, "Power BI Report", "btn-ghost")}
      ${ext(p.links.docs, "Documentation", "btn-ghost")}
    </div>
    <p class="fine">${esc(p.disclaimer)}</p>

    <div class="case-grid">
      <nav class="toc" aria-label="Case study sections"><b>Contents</b>${toc}</nav>
      <div class="case-body">${p.caseStudy.map(section).join("")}</div>
    </div>
  </div>`;

  /* ---------- interactions ---------- */
  const setOpen = (qb, open) => {
    qb.querySelector(".qb-toggle").setAttribute("aria-expanded", open ? "true" : "false");
    qb.querySelector(".qb-body").hidden = !open;
  };

  main.addEventListener("click", async (e) => {
    const tog = e.target.closest(".qb-toggle");
    if (tog) {
      setOpen(tog.closest("[data-qb]"), tog.getAttribute("aria-expanded") !== "true");
      return;
    }
    const all = e.target.closest("[data-expand]");
    if (all) {
      const open = all.dataset.expand === "all";
      document.querySelectorAll("#sql [data-qb]").forEach((qb) => setOpen(qb, open));
      return;
    }
    const cp = e.target.closest("[data-copy]");
    if (cp) {
      const ok = await copyText(copyStore[Number(cp.dataset.copy)]);
      const label = cp.dataset.label;
      cp.textContent = ok ? "Copied ✓" : "Copy failed";
      cp.classList.toggle("done", ok);
      const status = document.getElementById("copy-status");
      if (status) status.textContent = ok ? "Copied to clipboard" : "Copy failed. Select the code and press Ctrl+C.";
      clearTimeout(cp._t);
      cp._t = setTimeout(() => { cp.textContent = label; cp.classList.remove("done"); }, 1800);
    }
  });

  /* Open the query a link points to (e.g. #sql-B), and keep the TOC highlight in sync. */
  const tocLinks = [...document.querySelectorAll(".toc a")];
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) tocLinks.forEach((a) => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id));
      });
    }, { rootMargin: "-20% 0px -70% 0px" });
    document.querySelectorAll(".cs-section, .sql-group").forEach((el) => io.observe(el));
  }
})();

  </script>
  <script>
(function () {
  const home = document.getElementById("main"), cs = document.getElementById("caseMain");
  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    const el = id ? document.getElementById(id) : null;
    const wantCase = id === "case" || !!(el && cs.contains(el));
    const was = !cs.hidden;
    cs.hidden = !wantCase; home.hidden = wantCase;
    if (wantCase !== was) {
      if (el && id !== "case") el.scrollIntoView(); else window.scrollTo(0, 0);
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
